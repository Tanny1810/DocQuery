name: DocQuery CI

on:
  pull_request:
  push:
    branches: [ "main" ]

env:
  ENV: test

jobs:
  setup-deps:
    name: Setup and cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements-ci.txt', 'worker/requirements-ci.txt') }}

      - name: Install dependencies and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-ci.txt
          pip install ruff pytest

  lint:
    name: Lint (shared + api + worker)
    runs-on: ubuntu-latest
    needs: setup-deps
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements-ci.txt', 'worker/requirements-ci.txt') }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linter
        run: |
          ruff check shared api worker

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup-deps
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements-ci.txt', 'worker/requirements-ci.txt') }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-ci.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          pytest -q -k "not integration"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup-deps
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docquery_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements-ci.txt', 'worker/requirements-ci.txt') }}

      - name: Install integration deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-ci.txt
          pip install pytest alembic psycopg2-binary

      - name: Wait for services
        run: |
          until nc -z localhost 5432; do sleep 1; done
          until nc -z localhost 5672; do sleep 1; done

      - name: Run DB migrations
        run: |
          cd api
          alembic upgrade head

      - name: Run integration tests
        run: |
          pytest -v

  build-api:
    name: Build API Docker image (CI lightweight)
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build -t docquery-api:ci -f api/Dockerfile.ci .

  build-worker:
    name: Build Worker Docker image (CI lightweight)
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Worker image
        run: |
          docker build -t docquery-worker:ci -f worker/Dockerfile.ci .
