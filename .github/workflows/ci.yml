name: DocQuery CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docquery_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      ENV: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt', 'worker/requirements.txt') }}

      - name: Install dependencies and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-ci.txt
          pip install ruff pytest

      - name: Lint (shared + api + worker)
        run: |
          ruff check shared api worker

      - name: Wait for services
        run: |
          until nc -z localhost 5432; do sleep 1; done
          until nc -z localhost 5672; do sleep 1; done

      - name: Run DB migrations
        run: |
          cd api
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -v

      - name: Build API Docker image (CI lightweight)
        run: |
          docker build -t docquery-api:ci -f api/Dockerfile.ci .

      - name: Build Worker Docker image
        run: |
          docker build -t docquery-worker:ci -f worker/Dockerfile .
